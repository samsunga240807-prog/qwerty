<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mənimlə əlaqə saxlayın</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f4ef; --card:#ffffff; --text:#1c1b1a; --muted:#6b675f; --accent:#0a7d5a; --accent-text:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121413; --card:#1c1f1e; --text:#f1efe9; --muted:#9a968d; --accent:#2fc18f; --accent-text:#08140f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121413; --card:#1c1f1e; --text:#f1efe9; --muted:#9a968d; --accent:#2fc18f; --accent-text:#08140f;
}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
}
.card{
  background:var(--card);border-radius:28px;padding:48px 32px;max-width:420px;width:100%;
  text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08);
}
.icon{
  width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-text);
  display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:32px;
}
h1{font-size:2rem;margin:0 0 12px;line-height:1.2}
.number{display:block;color:var(--muted);font-size:1.25rem;margin-bottom:32px;letter-spacing:.02em}
.btn{
  display:inline-block;background:var(--accent);color:var(--accent-text);text-decoration:none;
  font-weight:600;font-size:1.15rem;padding:16px 36px;border-radius:999px;
}
.btn:active{transform:scale(.97)}
</style>
</head>
<body>
<main class="card">
  <div class="icon" aria-hidden="true">📞</div>
  <h1>Mənimlə əlaqə saxlayın</h1>
  <span class="number">+994 77 621 11 12</span>
  <a class="btn" href="tel:+994776211112">Zəng et</a>
</main>
</body>
</html>
